<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f6f4f0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101012" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="LifeLog">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>LifeLog</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <script src="https://accounts.google.com/gsi/client" async onload="window.gisReady && window.gisReady()"></script>
  <script src="app.js" type="module"></script>
</head>
<body>
  <header class="bar" id="bar" hidden>
    <div class="brand"><img src="icon.svg" alt="" width="22" height="22">LifeLog</div>
    <div class="bar-right">
      <span class="sync" id="sync" title="Updates every 20 seconds"></span>
      <button class="icon-btn" id="menu-btn" aria-label="Menu" aria-haspopup="menu">
        <svg viewBox="0 0 24 24" width="22" height="22"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
      </button>
      <div class="menu" id="menu" role="menu" hidden>
        <button role="menuitem" data-act="export-json">Export everything (JSON)</button>
        <button role="menuitem" data-act="export-csv">Export entries (CSV)</button>
        <button role="menuitem" data-act="signout">Sign out</button>
      </div>
    </div>
  </header>

  <main id="app" hidden>
    <div id="days"><p class="quiet">Loading…</p></div>
    <div class="more" id="more" hidden><button class="ghost" id="more-btn">Show earlier days</button></div>
  </main>

  <section class="signin" id="signin" hidden>
    <img src="icon.svg" alt="" width="64" height="64">
    <h1>LifeLog</h1>
    <p>Your days, logged by talking to Claude.</p>
    <div id="gbtn"></div>
    <p class="error" id="signin-error"></p>
  </section>

  <button class="fab" id="add-btn" aria-label="Add an entry" hidden>
    <svg viewBox="0 0 24 24" width="26" height="26"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none"/></svg>
  </button>

  <dialog class="sheet" id="sheet">
    <form method="dialog" id="sheet-form" novalidate></form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
